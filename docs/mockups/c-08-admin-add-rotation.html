<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Rotation — Unijos VTH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0d9488' },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 text-sm">

<!-- Background page (dimmed) -->
<div class="flex h-screen overflow-hidden opacity-30 pointer-events-none">
  <aside class="w-60 bg-white border-r border-slate-200 flex flex-col shrink-0">
    <div class="px-5 py-4 border-b border-slate-100">
      <p class="text-sm font-bold text-slate-900">System Administration</p>
    </div>
    <nav class="flex-1 px-3 py-3 space-y-0.5">
      <a href="#" class="flex items-center gap-2.5 px-3 py-2 rounded-md bg-teal-50 text-teal-700 font-semibold text-sm">Rotations</a>
    </nav>
  </aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-14 bg-white border-b border-slate-200"></header>
    <main class="flex-1 p-6">
      <div class="bg-white rounded-lg border border-slate-200 h-40"></div>
    </main>
  </div>
</div>

<!-- Modal overlay -->
<div class="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
  <div class="bg-white rounded-xl shadow-2xl w-full max-w-md border border-slate-200">

    <!-- Modal header -->
    <div class="px-6 pt-6 pb-4 border-b border-slate-100 flex items-center justify-between">
      <div>
        <h2 class="text-base font-bold text-slate-900">Add Rotation Assignment</h2>
        <p class="text-xs text-slate-500 mt-0.5">Assign a student to a clinic or lab for a rotation period.</p>
      </div>
      <button class="text-slate-400 hover:text-slate-600 p-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Form -->
    <div class="px-6 py-5 space-y-4">

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Student</label>
        <select class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
          <option value="">— Select student —</option>
          <option selected>Ibrahim Musa (Y5)</option>
          <option>Aisha Suleiman (Y5)</option>
          <option>Emeka Nwosu (Y5)</option>
          <option>Fatima Garba (Y5)</option>
          <option>Yusuf Bello (Y5)</option>
          <option>Ngozi Chukwu (Y4)</option>
          <option>Abdulrahman Diko (Y4)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Rotation type</label>
        <select class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
          <option>Small Animal Clinic (SAC)</option>
          <option selected>Large Animal Clinic (LAC)</option>
          <option>Avian & Aquatic Clinic (AAC)</option>
          <option>Pathology Laboratory (PATH)</option>
          <option>Surgery & Anaesthesia (SURG)</option>
          <option>Radiology (RAD)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Start date</label>
          <input type="date" value="2026-04-14" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">End date</label>
          <input type="date" value="2026-05-09" class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Semester</label>
        <select class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
          <option selected>2025/2026 Semester 2</option>
          <option>2025/2026 Semester 1</option>
          <option>2024/2025 Semester 2</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Supervisor <span class="text-slate-400 font-normal">(optional)</span></label>
        <select class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
          <option value="">— Assign later —</option>
          <option selected>Dr. Aliyu Danladi (Resident Vet)</option>
          <option>Dr. Suleiman Baba (Lecturer)</option>
          <option>Prof. Ngozi Okonkwo (Professor)</option>
        </select>
      </div>

      <!-- Duration preview -->
      <div class="bg-teal-50 border border-teal-200 rounded-md px-4 py-3">
        <p class="text-xs text-teal-700">Duration: <span class="font-semibold">4 weeks</span> (14 Apr – 9 May 2026) · Ibrahim Musa currently on SAC — this rotation starts after current ends.</p>
      </div>

    </div>

    <!-- Actions -->
    <div class="px-6 pb-6 flex items-center justify-between">
      <button class="text-sm text-slate-500 hover:text-slate-700">Cancel</button>
      <button class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold px-6 py-2 rounded-md">Save Rotation</button>
    </div>

  </div>
</div>

</body>
</html>
