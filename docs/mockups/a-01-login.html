<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Unijos VTH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0d9488' },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Header -->
    <div class="text-center mb-8">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">University of Jos</p>
      <h1 class="text-xl font-bold text-slate-900">Veterinary Teaching Hospital</h1>
      <p class="text-sm text-slate-500 mt-1">Staff Portal</p>
    </div>

    <!-- Login card -->
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-8">
      <h2 class="text-sm font-semibold text-slate-900 mb-5">Sign in to your account</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email address</label>
          <input
            type="email"
            value="maryam.buba@unijos-vth.edu.ng"
            class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Password</label>
          <input
            type="password"
            value="••••••••••"
            class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>

        <button class="w-full bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold py-2.5 rounded-md transition-colors mt-1">
          Sign in
        </button>
      </div>

      <p class="text-xs text-slate-400 text-center mt-6 leading-relaxed">
        Accounts are provisioned by the system administrator.<br>
        Contact admin if you cannot log in.
      </p>
    </div>

    <p class="text-center text-xs text-slate-400 mt-5">Unijos VTH Management System · v1.0</p>
  </div>
</body>
</html>
