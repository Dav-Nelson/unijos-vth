<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Unijos VTH</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0d9488' },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <!-- Header -->
    <div class="text-center mb-8">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">University of Jos</p>
      <h1 class="text-xl font-bold text-slate-900">Veterinary Teaching Hospital</h1>
    </div>

    <!-- Banner -->
    <div class="bg-amber-50 border border-amber-200 rounded-md px-4 py-3 mb-5 flex gap-3 items-start">
      <svg class="w-4 h-4 text-amber-600 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3m0 3h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
      </svg>
      <div>
        <p class="text-xs font-semibold text-amber-800">Password change required</p>
        <p class="text-xs text-amber-700 mt-0.5">Your account was created with a temporary password. You must set a new password before continuing.</p>
      </div>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-8">
      <h2 class="text-sm font-semibold text-slate-900 mb-5">Set your new password</h2>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Temporary password</label>
          <input
            type="password"
            placeholder="Enter the temporary password you received"
            class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">New password</label>
          <input
            type="password"
            placeholder="At least 8 characters"
            class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1.5">Confirm new password</label>
          <input
            type="password"
            placeholder="Repeat your new password"
            class="w-full border border-slate-200 rounded-md px-3 py-2 text-sm text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500"
          />
        </div>

        <button class="w-full bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold py-2.5 rounded-md transition-colors">
          Set new password and continue
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-5">You cannot access any other page until this is done.</p>
  </div>
</body>
</html>
